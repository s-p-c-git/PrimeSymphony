name: Build LaTeX Paper

on:
  push:
    paths:
      - 'shifted-prime-tension/paper/**'
      - '.github/workflows/build-paper.yml'
  pull_request:
    paths:
      - 'shifted-prime-tension/paper/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shifted-prime-tension/paper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            cm-super

      - name: First pdflatex pass
        run: pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Second pdflatex pass (resolve references)
        run: pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Check for undefined references
        run: |
          if grep -q 'LaTeX Warning:.*undefined references' main.log; then
            echo "::error::Undefined references found"
            grep 'LaTeX Warning:.*undefined' main.log
            exit 1
          fi
          echo "No undefined references."

      - name: Check for overfull boxes
        run: |
          OVERFULL=$(grep -c 'Overfull' main.log || true)
          if [ "$OVERFULL" -gt 0 ]; then
            echo "::warning::$OVERFULL overfull box warning(s) found"
            grep 'Overfull' main.log
          else
            echo "No overfull boxes."
          fi

      - name: Verify page count
        run: |
          PAGES=$(grep -oP 'Output written on main.pdf \(\K[0-9]+' main.log)
          echo "Page count: $PAGES"
          if [ "$PAGES" -lt 4 ] || [ "$PAGES" -gt 10 ]; then
            echo "::warning::Unexpected page count ($PAGES). Expected ~6 pages."
          fi

      - name: Verify PDF is valid
        run: |
          file main.pdf | grep -q 'PDF document' || { echo "::error::main.pdf is not a valid PDF"; exit 1; }
          echo "PDF is valid."

      - name: Retracted-claim language guard
        run: |
          echo "=== Language Guard (retracted claims must not return) ==="
          # Whitespace normalisation is REQUIRED: a plain line-oriented grep gives
          # false negatives on phrases LaTeX wraps across source lines. That is
          # exactly what defeated the original audit.
          NORM=$(tr '\n' ' ' < main.tex | tr -s ' ')

          FAIL=0
          check_absent() {
            if printf '%s' "$NORM" | grep -qF "$1"; then
              echo "::error::retracted claim reintroduced: $1"
              FAIL=1
            fi
          }
          check_absent "We make this rigorous"
          check_absent "special case of a general identity of Chavez"
          check_absent "2023 decomposition of Chavez"
          check_absent "Certified zero count"

          if ! printf '%s' "$NORM" | grep -qF "certification that would license"; then
            echo "::error::rigor caveat missing from main.tex"
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "PASS: no retracted claims; rigor caveat present."

      - name: arXiv compliance checks
        run: |
          echo "=== arXiv Submission Quality Checks ==="
          ERRORS=0

          # No .bib dependency (bibliography is embedded)
          if grep -q '\\bibliography{' main.tex; then
            echo "::error::External .bib file detected. arXiv prefers embedded bibliography or .bbl."
            ERRORS=$((ERRORS+1))
          else
            echo "PASS: Bibliography is embedded (thebibliography)."
          fi

          # No absolute paths in figure includes
          if grep -oP '\\includegraphics.*\{/.*\}' main.tex; then
            echo "::error::Absolute path in \\includegraphics. Use relative paths for arXiv."
            ERRORS=$((ERRORS+1))
          else
            echo "PASS: All figure paths are relative."
          fi

          # All referenced figures exist
          MISSING=0
          for fig in $(grep -oP '\\includegraphics\[.*?\]\{\K[^}]+' main.tex); do
            if [ ! -f "$fig" ]; then
              echo "::error::Missing figure: $fig"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "PASS: All referenced figures are present."
          else
            ERRORS=$((ERRORS+MISSING))
          fi

          # Figures are PNG/PDF/EPS (arXiv-compatible formats)
          for fig in $(grep -oP '\\includegraphics\[.*?\]\{\K[^}]+' main.tex); do
            ext="${fig##*.}"
            case "$ext" in
              png|pdf|eps|jpg|jpeg) ;;
              *) echo "::warning::Figure $fig has unusual extension .$ext"; ;;
            esac
          done
          echo "PASS: All figures use arXiv-compatible formats."

          # Check total submission size (arXiv limit: 50 MB uncompressed)
          SIZE=$(du -sb . | cut -f1)
          SIZE_MB=$((SIZE / 1048576))
          echo "Submission size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "::error::Submission exceeds arXiv 50 MB limit."
            ERRORS=$((ERRORS+1))
          else
            echo "PASS: Submission size within arXiv limit."
          fi

          # Check for hyperref (arXiv supports it but flags sometimes)
          if grep -q '\\usepackage.*hyperref' main.tex; then
            echo "INFO: hyperref is loaded (arXiv-compatible)."
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS arXiv compliance issue(s) found."
            exit 1
          fi
          echo "=== All arXiv checks passed ==="

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: shifted-prime-tension/paper/main.pdf
          retention-days: 30
