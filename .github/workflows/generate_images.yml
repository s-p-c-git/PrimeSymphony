name: Generate and Commit Visualizations

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/visualizations.py'
      - 'requirements.txt'
      - '.github/workflows/generate_images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run visualizations script
        run: python src/visualizations.py

      - name: Commit generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "ci: regenerate visualization images [skip ci]"
            git push
          fi
